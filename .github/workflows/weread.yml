name: weread
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ============修复：先创建目录，再下载解压Skill============
      - name: Upgrade WeRead Skill
        run: |
          mkdir -p ./skills/weread
          curl -L -o weread-skills.zip https://cdn.weread.qq.com/skills/weread-skills.zip
          unzip -o weread-skills.zip -d ./skills/weread
          rm weread-skills.zip
      # =========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python main.py
